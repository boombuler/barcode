name: Lint
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The Go version must match the one golangci-lint was built with,
      # so bump them together. It is shown by `golangci-lint version`.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
